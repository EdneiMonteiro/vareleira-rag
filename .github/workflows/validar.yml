# Validação do repositório em pull requests e na branch principal. Este workflow só LÊ o conteúdo: não usa segredos,
# não faz login no Azure (sem OIDC), não usa ambiente protegido e roda só em runners hospedados pelo GitHub.
# O runner confiável do L300 e o ambiente protegido pertencem exclusivamente ao l300-implantar.yml (disparo manual).
# O l300-implantar.yml também chama este arquivo (workflow_call) antes de qualquer implantação.
name: Validar

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Mesma versão usada nos testes locais. O Bicep dos runners hospedados é mais antigo e não tipa as APIs de 2026
  # (avisos BCP081), o que reprovaria o teste de lint dos arquivos do L200. Troque a versão aqui, em um só lugar.
  BICEP_VERSAO: v0.48.1

jobs:
  testes:
    name: Testes (Python 3.12, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar o Bicep fixado
        run: az bicep install --version "$BICEP_VERSAO"

      - name: Instalar as dependências do L300
        run: python -m pip install -r requirements/l300.txt

      - name: Conferir as dependências
        run: python -m pip check

      - name: Executar os testes (sem Azure)
        run: python -m unittest discover -s tests

  bicep:
    name: Bicep (lint sem avisos e build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Bicep fixado
        run: az bicep install --version "$BICEP_VERSAO"

      - name: Conferir a versão instalada
        run: |
          versao="$("$HOME/.azure/bin/bicep" --version)"
          echo "$versao"
          if [[ "$versao" != *"${BICEP_VERSAO#v}"* ]]; then
            echo "[ERRO] A versão do Bicep é diferente da fixada ($BICEP_VERSAO)." >&2
            exit 1
          fi

      - name: Lint (sem avisos) e build de todos os arquivos Bicep
        run: |
          bicep="$HOME/.azure/bin/bicep"
          falhas=0
          while IFS= read -r arquivo; do
            if ! saida="$("$bicep" lint "$arquivo" 2>&1)" || [ -n "$saida" ]; then
              echo "[ERRO] Lint com avisos ou erros em $arquivo:"
              echo "$saida"
              falhas=$((falhas + 1))
            fi
            if ! "$bicep" build "$arquivo" --stdout > /dev/null; then
              echo "[ERRO] O arquivo não compila: $arquivo"
              falhas=$((falhas + 1))
            fi
          done < <(find infra -name '*.bicep' | sort)
          [ "$falhas" -eq 0 ]

  javascript:
    name: Interface web (sintaxe do JavaScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versão do Node.js do runner
        run: node --version

      - name: Verificar a sintaxe do JavaScript
        run: node --check web/app.js
